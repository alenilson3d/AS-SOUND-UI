<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <meta name="manifest" content="data:application/manifest+json,{'name':'Ui Player','short_name':'UiPlayer','display':'standalone','orientation':'landscape','start_url':'.'}">
    <title>Ui Soundcraft Player Pro - LED VU Version</title>
    <style>
        :root {
            --bg-dark: #111111;
            --ui-pink: #df1a5a;
            --ui-green: #00ff44;
            --ui-amber: #e1b428;
            --fader-red: #d12323;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            background-color: #000;
            color: #fff;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* --- TELA DE INTRODUÇÃO (SPLASH SCREEN) --- */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease-in-out, visibility 0.8s;
        }

        .splash-logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5vh;
            animation: splashEntrance 1.2s ease-out forwards;
        }

        .splash-box {
            font-style: italic;
            font-weight: 900;
            font-size: 8vh;
            color: #000;
            background: var(--ui-amber);
            padding: 0.5vh 3vw;
            border-radius: 8px;
            border: 2px solid #b88f14;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .splash-text {
            font-weight: 900;
            font-size: 6.5vh;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #fff;
        }

        @keyframes splashEntrance {
            0% { opacity: 0; transform: scale(0.9); filter: blur(5px); }
            100% { opacity: 1; transform: scale(1); filter: blur(0); }
        }

        .ui-container {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Top Bar --- */
        .top-bar {
            background: linear-gradient(to bottom, #5a5a5a 0%, #454545 15%, #2a2a2a 70%, #1e1e1e 100%);
            height: 10%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1vw;
            border-bottom: 2px solid #111;
            box-shadow: inset 0 1px 0 #777;
        }

        .nav-group { display: flex; gap: 2px; height: 90%; align-items: flex-end; }
        .nav-btn {
            background: linear-gradient(to bottom, #444, #2a2a2a);
            border: 1px solid #1a1a1a;
            border-radius: 4px 4px 0 0;
            color: #999;
            padding: 0 1.5vw;
            height: 85%;
            font-size: 1.8vh;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            box-shadow: inset 0 1px 0 #555;
        }
        .nav-btn.active {
            background: linear-gradient(to bottom, #616161, #3a3a3a);
            color: #fff;
            border-bottom: 3px solid var(--ui-pink);
            height: 95%;
        }
        .nav-btn svg { width: 1.8vh; height: 1.8vh; margin-right: 4px; stroke: currentColor; fill: none; stroke-width: 2; }

        .right-info { display: flex; align-items: center; gap: 1vw; margin-left: auto; }
        .init-tag { color: #3fe3e3; font-family: monospace; background: #0d1a1a; padding: 2px 1vw; border-radius: 4px; border: 1px solid #224444; font-size: 1.8vh; }
        .ui-logo { font-style: italic; font-weight: 900; font-size: 2.5vh; color: #fff; background: linear-gradient(to bottom, #333, #111); padding: 1px 1vw; border-radius: 4px; border: 1px solid #444; }

        /* --- Mixer Body --- */
        .main-content { flex: 1; display: flex; background-color: #0b0b0b; height: 90%; overflow: hidden; }

        .channel-strip {
            width: 9vw;
            background: linear-gradient(to right, #242424, #181818);
            border-right: 2px solid #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1vh 0.3vw;
            height: 100%;
        }
        .channel-strip.master { border-right: none; border-left: 2px solid #000; }

        .db-display {
            background-color: #000; color: #4df0f0; font-family: monospace; font-size: 1.6vh;
            width: 95%; text-align: center; padding: 3px 0; border: 1px solid #333; border-radius: 2px;
        }

        .strip-buttons { display: flex; gap: 2px; width: 95%; margin: 0.5vh 0; }
        .strip-btn {
            flex: 1; font-size: 1.3vh; font-weight: 900; padding: 4px 0;
            background: linear-gradient(to bottom, #444, #262626); border: 1px solid #111; color: #999; border-radius: 2px; cursor: default;
        }

        .fader-vu-container {
            flex: 1; display: flex; width: 95%; justify-content: space-between;
            padding: 1vh 0.4vw; background: #0c0f12; border: 1px solid #1a222d; margin: 0.5vh 0; position: relative; overflow: hidden;
        }
        .channel-strip.master .fader-vu-container { margin-top: 1vh; margin-bottom: 1vh; }

        .vu-canvas-element {
            width: 1.2vw;
            max-width: 11px;
            height: 100%;
            background: #05070a;
            border-radius: 1px;
        }

        .fader-rail { width: 8px; background: #070707; height: 100%; position: relative; border-radius: 4px; margin: 0 auto; }
        .fader-handle {
            width: 3.5vh; height: 5vh; min-width: 24px; min-height: 32px;
            background: linear-gradient(to bottom, #ff3333 0%, var(--fader-red) 40%, #800000 50%, #4a0000 100%);
            position: absolute; left: 50%; transform: translateX(-50%); top: 35%; cursor: grab; border-radius: 3px; box-shadow: 0 3px 6px rgba(0,0,0,0.8);
            z-index: 5;
            border: 1px solid #000;
        }
        .fader-handle::after { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: #fff; transform: translateY(-50%); }
        .channel-strip.master .fader-handle { background: linear-gradient(to bottom, #ffffff 0%, #cccccc 40%, #777777 50%, #333333 100%); }

        .channel-label { background: #000; width: 100%; text-align: center; font-weight: bold; padding: 6px 0; text-transform: uppercase; font-size: 1.5vh; }
        .channel-label.player-l, .channel-label.player-r { color: var(--ui-pink); }
        .channel-label.master-lbl { color: var(--ui-amber); }

        /* --- Center Screen --- */
        .center-player { flex: 1; display: flex; flex-direction: column; background-color: #111; width: 73vw; height: 100%; position: relative; }

        /* MODIFICADO: Ajustado para acomodar a nova barra de progresso no meio */
        .transport-bar {
            background: linear-gradient(to bottom, #222, #151515); height: 12%;
            display: flex; align-items: center; justify-content: space-between; padding: 0 1vw; border-bottom: 1px solid #000;
            gap: 2vw;
        }
        .transport-buttons { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
        .trans-btn {
            background: linear-gradient(to bottom, #333, #1f1f1f); border: 1px solid #0a0a0a;
            color: #eee; width: 7vh; height: 5vh; cursor: pointer; border-radius: 3px; display: flex; align-items: center; justify-content: center;
        }
        .trans-btn svg { width: 2.2vh; height: 2vh; stroke: currentColor; fill: none; stroke-width: 2.5; }
        .trans-btn.active { background: var(--ui-pink) !important; }

        .add-music-btn {
            background: var(--ui-pink); border: 1px solid #900; color: white;
            font-size: 1.4vh; height: 5vh; padding: 0 1.2vw; border-radius: 3px; cursor: pointer;
            font-weight: bold; display: flex; align-items: center; gap: 4px; box-shadow: inset 0 1px 0 #ff6b9d;
        }
        .add-music-btn svg { width: 2vh; height: 2vh; stroke: currentColor; fill: none; stroke-width: 3; }

        .reset-eq-btn {
            display: none; 
            background: linear-gradient(to bottom, #444, #222); border: 1px solid #000; color: #ff4747;
            font-size: 1.4vh; height: 5vh; padding: 0 1.2vw; border-radius: 3px; cursor: pointer;
            font-weight: bold; align-items: center; gap: 4px; box-shadow: inset 0 1px 0 #666;
        }
        .reset-eq-btn svg { width: 2vh; height: 2vh; stroke: currentColor; fill: none; stroke-width: 2.5; }

        /* ADICIONADO: Estilo da nova barra de progresso no meio da transport-bar */
        .progress-container {
            flex: 1;
            display: flex;
            align-items: center;
            height: 100%;
            padding: 0 1vw;
        }
        .progress-bar-wrapper {
            width: 100%;
            height: 12px;
            background: #070707;
            border: 1px solid #252525;
            border-radius: 6px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #be1249, var(--ui-pink));
            border-radius: 5px;
            transition: width 0.1s linear;
            box-shadow: 0 0 8px rgba(223, 26, 90, 0.5);
        }

        .time-counter { font-family: monospace; text-align: right; flex-shrink: 0; }
        .time-now { color: var(--ui-amber); font-size: 3vh; font-weight: bold; font-family: 'Courier New', monospace; line-height: 1; }
        .time-total { color: #777; font-size: 1.8vh; font-weight: bold; }

        /* Mídias */
        .browser-grid { display: flex; background-color: #151515; padding: 2px; height: 76%; overflow: hidden; gap: 2px; }
        .browser-column { flex: 1; background: #1c1c1c; border: 1px solid #2a2a2a; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
        .column-header { background: #252525; padding: 6px 1vw; font-weight: bold; color: #999; border-bottom: solid 1px #000; text-transform: uppercase; font-size: 1.6vh; }
        
        .column-list { list-style: none; overflow-y: auto; flex: 1; background: #181818; }
        .column-item { padding: 1.2vh 1vw; border-bottom: 1px solid #222; cursor: pointer; font-size: 1.8vh; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
        .column-item svg { width: 2vh; height: 2vh; stroke: currentColor; fill: none; stroke-width: 2; }
        
        .folder-item-content { display: flex; align-items: center; gap: 6px; width: 100%; justify-content: space-between; overflow: hidden; }
        .folder-text-wrapper { display: flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .delete-folder-btn { background: none; border: none; color: #666; cursor: pointer; display: flex; align-items: center; margin-left: auto; padding: 0 4px; transition: color 0.2s; }
        .delete-folder-btn:hover { color: #ff3333; }
        .delete-folder-btn svg { width: 1.8vh; height: 1.8vh; stroke: currentColor; fill: none; stroke-width: 2; }

        .column-item.active-folder { background-color: #252525; color: var(--ui-pink) !important; font-weight: bold; border-left: 4px solid var(--ui-pink); }
        .column-item.active-folder svg { stroke: var(--ui-pink); }
        .column-item.active-playing { color: var(--ui-pink) !important; font-weight: bold; border-left: 4px solid var(--ui-pink); }
        .column-item.active-playing svg { stroke: var(--ui-pink); }

        #file-input { display: none; }

        /* --- TELA DO EQUALIZADOR --- */
        .eq-container {
            display: none;
            flex: 1;
            height: 76%;
            background-color: #0b0f12;
            position: relative;
            box-sizing: border-box;
            border: 2px solid #222;
        }
        .eq-canvas { width: 100%; height: 100%; display: block; background: #070a0c; cursor: crosshair; }

        /* --- Footer --- */
        .footer-bar { background: #1c1c1c; height: 12%; border-top: 2px solid #000; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
        .footer-group { display: flex; gap: 2px; }
        .foot-btn { background: linear-gradient(to bottom, #333, #222); border: 1px solid #000; color: #aaa; padding: 6px 1.5vw; font-size: 1.5vh; font-weight: bold; text-transform: uppercase; cursor: pointer; border-radius: 2px; }
        .foot-btn.active { background: var(--ui-pink); color: white; }
        .foot-btn.danger { color: #ff3333; }
        .foot-btn.warning { color: var(--ui-amber); }
        
        .foot-btn#btn-mute-fx.active-warn { background: var(--ui-amber) !important; color: #000 !important; font-weight: 900; }
        .foot-btn#btn-mute-all.active-danger { background: #ff3333 !important; color: #fff !important; font-weight: 900; }

        /* --- DESIGN DO NOVO MODAL PROFISSIONAL CENTRO DA TELA --- */
        .ui-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s;
        }
        .ui-modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .ui-modal-box {
            background: linear-gradient(to bottom, #2c2c2c 0%, #151515 100%);
            border: 2px solid #3d3d3d;
            border-top: 4px solid var(--ui-pink);
            border-radius: 8px;
            width: 48vw;
            max-width: 440px;
            padding: 3vh 2.5vw;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.2);
        }
        .ui-modal-overlay.show .ui-modal-box {
            transform: scale(1);
        }
        .ui-modal-title {
            font-size: 2.4vh;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 2vh;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .ui-modal-title svg {
            width: 3vh;
            height: 3vh;
            stroke: var(--ui-pink);
            fill: none;
            stroke-width: 2.5;
        }
        .ui-modal-text {
            font-size: 1.9vh;
            color: #dddddd;
            margin-bottom: 3.5vh;
            line-height: 1.5;
            word-break: break-word;
        }
        .ui-modal-actions {
            display: flex;
            justify-content: center;
            gap: 1.5vw;
        }
        .modal-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.2vh 2.2vw;
            font-size: 1.6vh;
            font-weight: 900;
            text-transform: uppercase;
            border: 1px solid #000;
            border-radius: 4px;
            cursor: pointer;
            min-width: 110px;
            transition: background 0.2s, color 0.2s;
        }
        .modal-btn-confirm {
            background: var(--ui-pink);
            color: #fff;
            box-shadow: inset 0 1px 0 #ff6b9d;
        }
        .modal-btn-confirm:hover {
            background: #be1249;
        }
        .modal-btn-cancel {
            background: linear-gradient(to bottom, #444, #2a2a2a);
            color: #bbbbbb;
            box-shadow: inset 0 1px 0 #555;
        }
        .modal-btn-cancel:hover {
            background: #333;
            color: #fff;
        }
    </style>

                            <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="4" x2="19" y2="20"/></svg>
                        </button>
                        
                        <button class="add-music-btn" id="btn-add-files" onclick="document.getElementById('file-input').click()">
                            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Files
                        </button>
                        <input type="file" id="file-input" webkitdirectory directory multiple accept=".mp3,.m4a,.wav,.aac,audio/*" onchange="loadUserFiles(this.files)">

                        <button class="reset-eq-btn" id="btn-reset-eq" onclick="resetEqualizer()">
                            <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg> Reset EQ
                        </button>
                    </div>

                    <!-- ADICIONADO: Elemento estrutural da Barra de Progresso Interativa -->
                    <div class="progress-container">
                        <div class="progress-bar-wrapper" id="progress-bar-container" onclick="seekAudio(event)">
                            <div class="progress-bar-fill" id="progress-bar-fill"></div>
                        </div>
                    </div>

                    <div class="time-counter">
                        <div class="time-now" id="time-current">00:00</div>
                        <div class="time-total" id="time-duration">00:00</div>
                    </div>
                </div>

                <div class="browser-grid" id="screen-media-browser">
                    <div class="browser-column">
                        <div class="column-header">Pastas</div>
                        <ul class="column-list" id="folder-list-container"></ul>
                    </div>
                    <div class="browser-column">
                        <div class="column-header">Músicas</div>
                        <ul class="column-list" id="file-list-container"></ul>
                    </div>
                </div>

                <div class="eq-container" id="screen-equalizer">
                    <canvas id="eqCanvas" class="eq-canvas"></canvas>
                </div>

                <div class="footer-bar">
                    <div class="footer-group">
                        <button class="foot-btn active" id="btn-mode-auto" onclick="setPlaybackMode('auto')">Auto</button>
                        <button class="foot-btn" id="btn-mode-shuffle" onclick="setPlaybackMode('shuffle')">Shuffle</button>
                    </div>
                    <div class="footer-group">
                        <button class="foot-btn warning" id="btn-mute-fx" onclick="toggleMuteFX()">Mute Fx</button>
                        <button class="foot-btn danger" id="btn-mute-all" onclick="toggleMuteAll()">Mute All</button>
                    </div>
                </div>
            </div>

            <div class="channel-strip master">
                <div class="db-display" id="db-M">-0.0 dB</div>
                <div class="fader-vu-container">
                    <canvas id="canvas-vu-M1" class="vu-canvas-element"></canvas>
                    <div class="fader-rail"><div class="fader-handle" id="fader-M"></div></div>
                    <canvas id="canvas-vu-M2" class="vu-canvas-element"></canvas>
                </div>
                <div class="channel-label master-lbl">Master</div>
            </div>
        </div>
    </div>

    <script>
        let dpr = window.devicePixelRatio || 1;

        function showScreen(screenType) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            const btnAddFiles = document.getElementById('btn-add-files');
            const btnResetEq = document.getElementById('btn-reset-eq');

            if (screenType === 'mix') {
                document.getElementById('nav-mix').classList.add('active');
                document.getElementById('screen-media-browser').style.display = 'flex';
                document.getElementById('screen-equalizer').style.display = 'none';
                btnResetEq.style.display = 'none';
                btnAddFiles.style.display = 'flex';
            } else if (screenType === 'fx') {
                document.getElementById('nav-fx').classList.add('active');
                document.getElementById('screen-media-browser').style.display = 'none';
                document.getElementById('screen-equalizer').style.display = 'block';
                btnAddFiles.style.display = 'none';
                btnResetEq.style.display = 'flex';
                resizeCanvas();
                drawEQ();
            }
        }

        // --- EQUALIZADOR LOGARÍTMICO HD ---
        const canvas = document.getElementById('eqCanvas');
        const ctx = canvas.getContext('2d');
        let eqNodes = []; let selectedNode = null;
        const minFreq = 20; const maxFreq = 20000;

        const nodeColors = [
            { color: '#2a5cd1', bg: 'rgba(42,92,209,0.35)' },
            { color: '#2ad15c', bg: 'rgba(42,209,92,0.35)' },
            { color: '#d12a2a', bg: 'rgba(209,42,42,0.35)' },
            { color: '#8a2ad1', bg: 'rgba(138,42,209,0.35)' },
            { color: '#d1b62a', bg: 'rgba(209,182,42,0.35)' }
        ];

        function freqToX(freq) { return (Math.log10(freq) - Math.log10(minFreq)) / (Math.log10(maxFreq) - Math.log10(minFreq)); }
        function xToFreq(x) { return Math.pow(10, Math.log10(minFreq) + x * (Math.log10(maxFreq) - Math.log10(minFreq))); }

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            if (rect.width > 0) {
                canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr); canvas.style.width = rect.width + 'px'; canvas.style.height = rect.height + 'px';
            }
        }
        window.addEventListener('resize', () => { resizeCanvas(); drawEQ(); });

        function drawEQ() {
            const w = canvas.width / dpr; const h = canvas.height / dpr; ctx.clearRect(0, 0, w, h);
            
            ctx.lineWidth = 1;

            let mainFreqs = [31.5, 63, 125, 250, 500, 1000, 2000, 4000, 8000, 16000];
            let labelsX = ['31.5', '63', '125', '250', '500', '1k', '2k', '4k', '8k', '16k'];

            for (let f = 20; f <= 20000; f += (f < 100 ? 10 : f < 1000 ? 50 : f < 10000 ? 500 : 2000)) {
                let pInter = freqToX(f);
                ctx.beginPath(); ctx.strokeStyle = 'rgba(20, 28, 34, 0.4)';
                ctx.moveTo(pInter * w, 0); ctx.lineTo(pInter * w, h); ctx.stroke();
            }

            mainFreqs.forEach((f, idx) => {
                let p = freqToX(f);
                ctx.beginPath(); ctx.strokeStyle = 'rgba(30, 43, 53, 0.8)';
                ctx.moveTo(p * w, 0); ctx.lineTo(p * w, h); ctx.stroke();
                
                ctx.fillStyle = '#4e5e6a'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(labelsX[idx], p * w, h - 8);
            });

            let linesY = [0.15, 0.35, 0.55, 0.75, 0.90]; 
            let labelsY = ['+12', '+6', '0', '-6', '-12'];
            
            for (let percentY = 0.05; percentY <= 0.95; percentY += 0.05) {
                ctx.beginPath(); ctx.strokeStyle = 'rgba(20, 28, 34, 0.4)';
                ctx.moveTo(0, percentY * h); ctx.lineTo(w, percentY * h); ctx.stroke();
            }

            linesY.forEach((p, idx) => {
                ctx.beginPath(); ctx.strokeStyle = idx === 2 ? '#3a4b57' : 'rgba(30, 43, 53, 0.8)';
                ctx.moveTo(0, p * h); ctx.lineTo(w, p * h); ctx.stroke(); 
                ctx.fillStyle = '#4e5e6a'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'left';
                ctx.fillText(labelsY[idx], 10, p * h - 4);
            });

            let sortedNodes = [...eqNodes].sort((a, b) => a.x - b.x);
            ctx.beginPath(); ctx.moveTo(0, h * 0.55);

            if (sortedNodes.length === 0) { ctx.lineTo(w, h * 0.55); } 
            else {
                for (let i = 0; i < sortedNodes.length; i++) {
                    let n = sortedNodes[i];
                    if (i === 0) { ctx.quadraticCurveTo(n.x * w - 15, n.y * h, n.x * w, n.y * h); } 
                    else {
                        let prev = sortedNodes[i - 1];
                        ctx.bezierCurveTo((prev.x + n.x)/2 * w, prev.y * h, (prev.x + n.x)/2 * w, n.y * h, n.x * w, n.y * h);
                    }
                }
                let last = sortedNodes[sortedNodes.length - 1]; ctx.quadraticCurveTo(last.x * w + 15, h * 0.55, w, h * 0.55);
            }

            let shadowPath = new Path2D(ctx); shadowPath.lineTo(w, h); shadowPath.lineTo(0, h);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.02)'; ctx.fill(shadowPath);
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5; ctx.shadowBlur = 1; ctx.shadowColor = '#ffffff'; ctx.stroke(); ctx.shadowBlur = 0;

            eqNodes.forEach(node => {
                let nx = node.x * w; let ny = node.y * h;
                
                ctx.beginPath(); ctx.arc(nx, ny, 16, 0, 2 * Math.PI); ctx.fillStyle = node.bg; ctx.fill();
                ctx.beginPath(); ctx.arc(nx, ny, 8, 0, 2 * Math.PI); ctx.fillStyle = node.color; ctx.fill();
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();

                let nodeGain = (1 - (node.y - 0.05) / 0.87) * 24 - 12;
                let nodeDbText = (nodeGain >= 0 ? "+" : "") + nodeGain.toFixed(1) + " dB";
                if (Math.abs(nodeGain) < 0.05) nodeDbText = "0.0 dB";

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(nodeDbText, nx, ny - 22);
            });
        }

        function resetEqualizer() {
            eqNodes = []; drawEQ();
            if (audioContext) { lowFilter.gain.value = 0; midFilter.gain.value = 0; highFilter.gain.value = 0; }
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX; let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (clientX - rect.left) / rect.width, y: (clientY - rect.top) / rect.height };
        }

        function startMove(e) {
            const pos = getMousePos(e); selectedNode = null;
            eqNodes.forEach(node => {
                let dist = Math.hypot(node.x - pos.x, node.y - pos.y); if(dist < 0.05) { selectedNode = node; }
            });
            if (!selectedNode) {
                let style = nodeColors[eqNodes.length % nodeColors.length];
                let newNode = { x: pos.x, y: pos.y, color: style.color, bg: style.bg };
                eqNodes.push(newNode); selectedNode = newNode; drawEQ();
            }
        }

        function doMove(e) {
            if(!selectedNode) return; const pos = getMousePos(e);
            selectedNode.x = Math.min(Math.max(pos.x, 0.005), 0.995); selectedNode.y = Math.min(Math.max(pos.y, 0.05), 0.92);
            drawEQ(); applyEQFilters();
        }

        canvas.addEventListener('mousedown', startMove); window.addEventListener('mousemove', doMove); window.addEventListener('mouseup', () => selectedNode = null);
        canvas.addEventListener('touchstart', startMove, {passive: true}); window.addEventListener('touchmove', doMove, {passive: true}); window.addEventListener('touchend', () => selectedNode = null);


        // --- ENGINE DE ÁUDIO REAL, TRACKS E PASTAS ---
        let audioContext = null; let audioElement = new Audio();
        audioElement.crossOrigin = "anonymous"; 
        
        let trackNode = null;
        let gainL = null, gainR = null, gainMaster = null; let analyserL = null; let analyserR = null;
        let lowFilter = null; let midFilter = null; let highFilter = null;
        
        let folders = {}; let currentFolder = null;
        let playingFolder = null; let playingTrackIndex = null;
        let volL = 0, volR = 0, volMaster = 0; let muteL = false, muteR = false;
        let playbackMode = 'auto'; 
        let muteFX = false; let muteAllGlobal = false;

        let peaks = { L1: 0, L2: 0, R1: 0, R2: 0, M1: 0, M2: 0 };
        let peakCounters = { L1: 0, L2: 0, R1: 0, R2: 0, M1: 0, M2: 0 };

        function initAudio() {
            if (audioContext) {
                if (audioContext.state === 'suspended') { audioContext.resume(); }
                return;
            }
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            gainL = audioContext.createGain(); gainR = audioContext.createGain(); gainMaster = audioContext.createGain();
            
            analyserL = audioContext.createAnalyser(); analyserR = audioContext.createAnalyser();
            analyserL.fftSize = 2048; analyserR.fftSize = 2048;
            analyserL.smoothingTimeConstant = 0; analyserR.smoothingTimeConstant = 0;

            lowFilter = audioContext.createBiquadFilter(); lowFilter.type = 'lowshelf'; lowFilter.frequency.value = 150;
            midFilter = audioContext.createBiquadFilter(); midFilter.type = 'peaking'; midFilter.Q.value = 1.0; midFilter.frequency.value = 1000;
            highFilter = audioContext.createBiquadFilter(); highFilter.type = 'highshelf'; highFilter.frequency.value = 5000;

            trackNode = audioContext.createMediaElementSource(audioElement);
            let splitter = audioContext.createChannelSplitter(2); let merger = audioContext.createChannelMerger(2);

            trackNode.connect(lowFilter); 
            lowFilter.connect(midFilter); 
            midFilter.connect(highFilter); 
            highFilter.connect(splitter);
            
            splitter.connect(gainL, 0); 
            splitter.connect(gainR, 1);
            
            gainL.connect(analyserL); 
            gainR.connect(analyserR);
            
            analyserL.connect(merger, 0, 0); 
            analyserR.connect(merger, 0, 1);
            
            merger.connect(gainMaster); 
            gainMaster.connect(audioContext.destination);

            updateVolumes(); initVUCases(); renderVUs();

            audioElement.onended = function() {
                handleTrackEnded();
            };
        }

        function setPlaybackMode(mode) {
            playbackMode = mode;
            document.getElementById('btn-mode-auto').classList.toggle('active', mode === 'auto');
            document.getElementById('btn-mode-shuffle').classList.toggle('active', mode === 'shuffle');
        }

        // --- CONTROLES DE INTERFACE DO MODAL EXCLUSIVO ---
        function askDeleteFolder(folderName, event) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }
            const modal = document.getElementById('delete-modal');
            const modalText = document.getElementById('delete-modal-text');
            const confirmBtn = document.getElementById('modal-confirm-btn');

            modalText.innerHTML = `Deseja realmente remover a pasta<br><strong style="color:var(--ui-pink); font-size: 2.2vh;">"${folderName}"</strong> do player?`;
            modal.classList.add('show');

            confirmBtn.onclick = function() {
                executeDeleteFolder(folderName);
                closeDeleteModal();
            };
        }

        function closeDeleteModal() {
            document.getElementById('delete-modal').classList.remove('show');
        }

        function executeDeleteFolder(folderName) {
            if (playingFolder === folderName) {
                stopAudio();
                playingFolder = null;
                playingTrackIndex = null;
            }
            if (currentFolder === folderName) {
                currentFolder = null;
            }
            delete folders[folderName];
            
            const fileInput = document.getElementById('file-input');
            if(fileInput) fileInput.value = "";
            
            renderFolders();
            if (currentFolder) {
                renderFiles(currentFolder);
            } else {
                document.getElementById('file-list-container').innerHTML = '';
            }
        }

        // ADICIONADO: Função para controlar a navegação/click na barra de progresso
        function seekAudio(event) {
            if (!audioElement || !audioElement.duration) return;
            const container = document.getElementById('progress-bar-container');
            const rect = container.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const percentage = clickX / rect.width;
            
            audioElement.currentTime = percentage * audioElement.duration;
        }

        window.addEventListener('DOMContentLoaded', () => {
            volL = 0; 
            volR = 0; 
            volMaster = 0;

            const meioFader = 46.5;
            document.getElementById('fader-L').style.top = meioFader + '%';
            document.getElementById('fader-R').style.top = meioFader + '%';
            document.getElementById('fader-M').style.top = meioFader + '%';

            document.getElementById('db-L').innerText = '-0.0 dB';
            document.getElementById('db-R').innerText = '-0.0 dB';
            document.getElementById('db-M').innerText = '-0.0 dB';

            setupFader('L', 'L'); 
            setupFader('R', 'R'); 
            setupFader('M', 'M');
            initVUCases();

            document.body.addEventListener('click', function() {
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume();
                }
            }, { once: true });

            setTimeout(() => {
                const splash = document.getElementById('app-splash-screen');
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
            }, 3000);
        });

        function toggleMuteFX() {
            muteFX = !muteFX;
            document.getElementById('btn-mute-fx').classList.toggle('active-warn', muteFX);
            applyEQFilters(); 
        }

        function toggleMuteAll() {
            muteAllGlobal = !muteAllGlobal;
            document.getElementById('btn-mute-all').classList.toggle('active-danger', muteAllGlobal);
            updateVolumes(); 
        }

        function handleTrackEnded() {
            if (!playingFolder || !folders[playingFolder] || folders[playingFolder].length === 0) return;

            if (playbackMode === 'shuffle') {
                let totalTracks = folders[playingFolder].length;
                if (totalTracks > 1) {
                    let nextIndex = playingTrackIndex;
                    while (nextIndex === playingTrackIndex) {
                        nextIndex = Math.floor(Math.random() * totalTracks);
                    }
                    selectTrack(nextIndex);
                } else {
                    selectTrack(0);
                }
            } else {
                nextTrack();
            }
        }

        function applyEQFilters() {
            if (!audioContext) return;
            
            if (muteFX || eqNodes.length === 0) {
                lowFilter.gain.value = 0;
                midFilter.gain.value = 0;
                highFilter.gain.value = 0;
                return;
            }

            let avgLowGain = 0, avgMidGain = 0, avgHighGain = 0; let lowCount = 0, midCount = 0; let highCount = 0;

            eqNodes.forEach(node => {
                let freq = xToFreq(node.x); let gain = (1 - (node.y - 0.05) / 0.87) * 24 - 12;
                if (freq <= 250) { avgLowGain += gain; lowCount++; }
                else if (freq > 250 && freq <= 4000) { avgMidGain += gain; midCount++; }
                else { avgHighGain += gain; highCount++; }
            });

            if (lowCount > 0) lowFilter.gain.value = avgLowGain / lowCount;
            if (midCount > 0) midFilter.gain.value = avgMidGain / midCount;
            if (highCount > 0) highFilter.gain.value = avgHighGain / highCount;
        }

        function loadUserFiles(files) {
            if (files.length > 0) {
                for(let i = 0; i < files.length; i++) {
                    const file = files[i]; const objectURL = URL.createObjectURL(file);
                    let pathParts = file.webkitRelativePath ? file.webkitRelativePath.split('/') : [];
                    
                    let folderName = pathParts.length > 1 ? pathParts[pathParts.length - 2] : "Músicas Avulsas";

                    if (!folders[folderName]) { folders[folderName] = []; }
                    folders[folderName].push({ name: file.name, url: objectURL });
                }
                
                document.getElementById('file-input').value = "";
                renderFolders();
            }
        }

        function renderFolders() {
            const container = document.getElementById('folder-list-container'); container.innerHTML = '';
            Object.keys(folders).forEach((folderName) => {
                const li = document.createElement('li'); li.className = 'column-item';
                if (currentFolder === folderName) li.className += ' active-folder';
                
                const safeFolderName = folderName.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                
                li.innerHTML = `<div class="folder-item-content">
                                    <div class="folder-text-wrapper">
                                        <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                                        <span class="folder-text">${folderName}</span>
                                    </div>
                                    <button class="delete-folder-btn" type="button" onclick="askDeleteFolder('${safeFolderName}', event)">
                                        <svg viewBox="0 0 24 24"><polyline points="3 6 5 3 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                                    </button>
                                </div>`;
                                
                li.onclick = function(e) { 
                    if(e.target.closest('.delete-folder-btn')) return;
                    currentFolder = folderName; 
                    renderFolders(); 
                    renderFiles(folderName); 
                };
                container.appendChild(li);
            });
            if (!currentFolder && Object.keys(folders).length > 0) { currentFolder = Object.keys(folders)[0]; renderFolders(); renderFiles(currentFolder); }
        }

        function renderFiles(folderName) {
            const container = document.getElementById('file-list-container'); container.innerHTML = '';
            const tracks = folders[folderName] || [];
            tracks.forEach((track, index) => {
                const li = document.createElement('li'); li.className = 'column-item';
                if (playingTrackIndex === index && playingFolder === folderName) { li.className += ' active-playing'; }
                li.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg> ' + track.name;
                li.onclick = function(e) { e.stopPropagation(); selectTrack(index); };
                container.appendChild(li);
            });
        }

        function selectTrack(index) {
            initAudio(); audioElement.pause(); audioElement.currentTime = 0;
            playingFolder = currentFolder; playingTrackIndex = index;
            renderFolders(); renderFiles(currentFolder);
            const track = folders[playingFolder][index]; audioElement.src = track.url; audioElement.load();
            
            if (audioContext && audioContext.state === 'suspended') audioContext.resume();
            
            audioElement.play().then(() => {
                const playBtn = document.getElementById('btn-play'); playBtn.classList.add('active'); 
                playBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
            }).catch(() => {});
            audioElement.onloadedmetadata = function() { document.getElementById('time-duration').innerText = formatTime(audioElement.duration); };
        }

        function togglePlay() {
            if (playingTrackIndex === null && currentFolder && folders[currentFolder].length > 0) { selectTrack(0); return; }
            if (playingTrackIndex === null) return;
            
            initAudio();
            if (audioContext && audioContext.state === 'suspended') audioContext.resume();
            
            const playBtn = document.getElementById('btn-play');
            if (audioElement.paused) {
                audioElement.play(); playBtn.classList.add('active'); 
                playBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
            } else {
                audioElement.pause(); playBtn.classList.remove('active'); 
                playBtn.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
            }
        }

        function stopAudio() {
            if (!audioElement) return; audioElement.pause(); audioElement.currentTime = 0;
            const playBtn = document.getElementById('btn-play'); playBtn.classList.remove('active'); 
            playBtn.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
            
            // MODIFICADO: Reseta a barra de progresso visual
            document.getElementById('progress-bar-fill').style.width = '0%';
        }

        function nextTrack() { if (!playingFolder || !folders[playingFolder] || folders[playingFolder].length === 0) return; let nextIndex = (playingTrackIndex !== null) ? playingTrackIndex + 1 : 0; if (nextIndex >= folders[playingFolder].length) nextIndex = 0; selectTrack(nextIndex); }
        function prevTrack() { if (!playingFolder || !folders[playingFolder] || folders[playingFolder].length === 0) return; let prevIndex = (playingTrackIndex !== null) ? playingTrackIndex - 1 : 0; if (prevIndex < 0) prevIndex = folders[playingFolder].length - 1; selectTrack(prevIndex); }

        // MODIFICADO: Atualiza o tempo numérico e também preenche a barra de progresso visualmente
        audioElement.ontimeupdate = function() { 
            document.getElementById('time-current').innerText = formatTime(audioElement.currentTime); 
            
            if (audioElement.duration) {
                const progressPercent = (audioElement.currentTime / audioElement.duration) * 100;
                document.getElementById('progress-bar-fill').style.width = progressPercent + '%';
            }
        };
        function formatTime(secs) { let m = Math.floor(secs / 60); let s = Math.floor(secs % 60); return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s); }

        function setupFader(id, type) {
            const handle = document.getElementById('fader-' + id); const container = handle.parentElement;
            
            function moveFader(ev) {
                const rect = container.getBoundingClientRect();
                let clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
                let offsetY = clientY - rect.top; 
                
                let percent = offsetY / rect.height;
                if (percent < 0) percent = 0; 
                if (percent > 0.93) percent = 0.93; 
                
                let normalizedPercent = percent / 0.93; 
                let db = 12 - (normalizedPercent * 24);
                
                if (db > -0.5 && db < 0.5) {
                    db = 0.0;
                    percent = 0.465; 
                }

                if (percent >= 0.93) db = -12.0;

                let dbText = (db >= 0 ? "+" : "") + db.toFixed(1) + " dB";
                if (db === 0) dbText = "-0.0 dB";

                if (type === 'L' || type === 'R') {
                    volL = db;
                    volR = db;
                    
                    document.getElementById('fader-L').style.top = (percent * 100) + '%';
                    document.getElementById('fader-R').style.top = (percent * 100) + '%';
                    
                    document.getElementById('db-L').innerText = dbText;
                    document.getElementById('db-R').innerText = dbText;
                } else {
                    volMaster = db;
                    handle.style.top = (percent * 100) + '%';
                    document.getElementById('db-' + id).innerText = dbText;
                }
                
                updateVolumes();
            }

            handle.addEventListener('mousedown', function(e) { 
                e.stopPropagation(); 
                window.addEventListener('mousemove', moveFader); 
                window.addEventListener('mouseup', function() { 
                    window.removeEventListener('mousemove', moveFader); 
                }, { once: true }); 
            });

            handle.addEventListener('touchstart', function(e) { 
                e.stopPropagation(); 
                window.addEventListener('touchmove', moveFader, { passive: false }); 
                window.addEventListener('touchend', function() { 
                    window.removeEventListener('touchmove', moveFader); 
                }, { once: true }); 
            });
        }

        function updateVolumes() { 
            if (!audioContext) return; 
            
            if (muteAllGlobal) {
                gainL.gain.value = 0;
                gainR.gain.value = 0;
                gainMaster.gain.value = 0;
                return;
            }

            let gainLinearL = volL <= -12 ? 0 : Math.pow(10, volL / 20);
            let gainLinearR = volR <= -12 ? 0 : Math.pow(10, volR / 20);
            let gainLinearMaster = volMaster <= -12 ? 0 : Math.pow(10, volMaster / 20);

            gainL.gain.value = gainLinearL; 
            gainR.gain.value = gainLinearR; 
            gainMaster.gain.value = gainLinearMaster; 
        }


        // --- ENGINE DO VU DE LED SEGMENTADO ---
        const totalLEDs = 20; const vuIds = ['L1', 'L2', 'R1', 'R2', 'M1', 'M2']; let vuCanvases = {};

        function initVUCases() {
            vuIds.forEach(id => {
                let c = document.getElementById('canvas-vu-' + id);
                if (c) {
                    let rect = c.getBoundingClientRect(); c.width = rect.width * dpr; c.height = rect.height * dpr;
                    let ctxVU = c.getContext('2d'); ctxVU.scale(dpr, dpr); vuCanvases[id] = { canvas: c, ctx: ctxVU };
                }
            });
        }

        function drawSegmentedVU(id, currentLevel) {
            let item = vuCanvases[id]; if (!item) return;
            let ctxVU = item.ctx; let w = item.canvas.width / dpr; let h = item.canvas.height / dpr;
            ctxVU.clearRect(0, 0, w, h);

            let ledHeight = (h / totalLEDs) - 1.5;

            if (currentLevel >= peaks[id]) { peaks[id] = currentLevel; peakCounters[id] = 18; } 
            else { if (peakCounters[id] > 0) { peakCounters[id]--; } else { peaks[id] -= 0.04; if (peaks[id] < 0) peaks[id] = 0; } }

            let litCount = Math.round(currentLevel * totalLEDs); let peakIndex = Math.round(peaks[id] * totalLEDs) - 1;

            for (let i = 0; i < totalLEDs; i++) {
                let isLit = i < litCount; let isPeak = i === peakIndex;
                let colorBase = ''; let glowColor = '';
                
                if (i < 14) { colorBase = '#006600'; glowColor = '#00ff22'; if (isLit || isPeak) colorBase = '#00ff22'; } 
                else if (i >= 14 && i < 17) { colorBase = '#665500'; glowColor = '#ffee00'; if (isLit || isPeak) colorBase = '#ffee00'; } 
                else { colorBase = '#660000'; glowColor = '#ff0000'; if (isLit || isPeak) colorBase = '#ff0000'; }

                let yPos = h - ((i + 1) * (h / totalLEDs)); ctxVU.fillStyle = colorBase;
                if (isLit || isPeak) { ctxVU.shadowBlur = 4; ctxVU.shadowColor = glowColor; } else { ctxVU.shadowBlur = 0; }
                ctxVU.fillRect(0, yPos, w, ledHeight);
            }
            ctxVU.shadowBlur = 0;
        }

        function renderVUs() {
            requestAnimationFrame(renderVUs);
            
            if (!audioContext || audioElement.paused || muteAllGlobal) { 
                vuIds.forEach(id => drawSegmentedVU(id, 0)); 
                return; 
            }
            
            let bufferL = new Float32Array(analyserL.fftSize);
            let bufferR = new Float32Array(analyserR.fftSize);
            analyserL.getFloatTimeDomainData(bufferL);
            analyserR.getFloatTimeDomainData(bufferR);

            let peakL = 0;
            let peakR = 0;
            
            for (let i = 0; i < bufferL.length; i++) {
                let valL = Math.abs(bufferL[i]);
                let valR = Math.abs(bufferR[i]);
                if (valL > peakL) peakL = valL;
                if (valR > peakR) peakR = valR;
            }

            let rawL = peakL; 
            let rawR = peakR;
            let rawM = ((peakL + peakR) / 2) * (volMaster > -12 ? Math.pow(10, volMaster / 20) : 0);

            let levelL = Math.min(rawL, 1); 
            let levelR = Math.min(rawR, 1); 
            let levelM = Math.min(rawM, 1);

            drawSegmentedVU('L1', levelL); drawSegmentedVU('L2', levelL);
            drawSegmentedVU('R1', levelR); drawSegmentedVU('R2', levelR);
            drawSegmentedVU('M1', levelM); drawSegmentedVU('M2', levelM);
        }
    </script>
<script id="as-sound-fullscreen-script">(function(){function toggle(){const d=document,r=document.documentElement;if(!d.fullscreenElement&&!d.webkitFullscreenElement){const f=r.requestFullscreen||r.webkitRequestFullscreen;if(f)f.call(r)}else{const f=d.exitFullscreen||d.webkitExitFullscreen;if(f)f.call(d)}}document.addEventListener('DOMContentLoaded',function(){const b=document.getElementById('btn-fullscreen');if(b)b.addEventListener('click',toggle)})})();</script>
<script id="as-sound-persist-script">
/* =========================================================
   AS SOUND PLAYER - MODULO DE BIBLIOTECA PERSISTENTE
   Adicionado sem alterar nenhuma linha do codigo original.
   Salva as pastas e as musicas importadas no IndexedDB do
   navegador, restaurando tudo automaticamente ao reabrir.
   ========================================================= */
(function () {
    const DB_NAME = 'ASSoundPlayerDB';
    const DB_VER = 1;
    const STORE = 'tracks';
    let dbPromise = null;
    let idbOk = true;

    /* ---------- aviso discreto na tela ---------- */
    function toast(msg, ms) {
        let box = document.getElementById('as-persist-toast');
        if (!box) {
            box = document.createElement('div');
            box.id = 'as-persist-toast';
            box.style.cssText = 'position:fixed;left:50%;bottom:12px;transform:translateX(-50%);' +
                'background:rgba(0,0,0,.88);color:#eee;border:1px solid rgba(255,255,255,.25);' +
                'border-radius:8px;padding:8px 14px;font:600 12px/1.35 sans-serif;z-index:99999;' +
                'max-width:88vw;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;';
            document.body.appendChild(box);
        }
        box.innerHTML = msg;
        box.style.opacity = '1';
        clearTimeout(box._t);
        box._t = setTimeout(() => { box.style.opacity = '0'; }, ms || 2600);
    }

    /* ---------- banco de dados ---------- */
    function openDB() {
        if (dbPromise) return dbPromise;
        dbPromise = new Promise((resolve, reject) => {
            let req;
            try { req = indexedDB.open(DB_NAME, DB_VER); }
            catch (e) { reject(e); return; }
            req.onupgradeneeded = function (e) {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(STORE)) {
                    const s = db.createObjectStore(STORE, { keyPath: 'id' });
                    s.createIndex('folder', 'folder', { unique: false });
                }
            };
            req.onsuccess = function (e) { resolve(e.target.result); };
            req.onerror = function (e) { reject(e.target.error || new Error('IndexedDB indisponivel')); };
            req.onblocked = function () { reject(new Error('IndexedDB bloqueado')); };
        });
        return dbPromise;
    }

    function saveTracks(fileList) {
        return openDB().then(db => new Promise((resolve, reject) => {
            const tx = db.transaction(STORE, 'readwrite');
            const store = tx.objectStore(STORE);
            const stamp = Date.now();
            fileList.forEach((file, i) => {
                const parts = file.webkitRelativePath ? file.webkitRelativePath.split('/') : [];
                const folder = parts.length > 1 ? parts[parts.length - 2] : 'Músicas Avulsas';
                store.put({
                    id: folder + '||' + file.name,
                    folder: folder,
                    name: file.name,
                    order: i,
                    savedAt: stamp,
                    blob: file
                });
            });
            tx.oncomplete = resolve;
            tx.onerror = function () { reject(tx.error); };
            tx.onabort = function () { reject(tx.error); };
        }));
    }

    function readAll() {
        return openDB().then(db => new Promise((resolve, reject) => {
            const tx = db.transaction(STORE, 'readonly');
            const req = tx.objectStore(STORE).getAll();
            req.onsuccess = function () { resolve(req.result || []); };
            req.onerror = function () { reject(req.error); };
        }));
    }

    function deleteFolderFromDB(folderName) {
        return openDB().then(db => new Promise((resolve, reject) => {
            const tx = db.transaction(STORE, 'readwrite');
            const store = tx.objectStore(STORE);
            const idx = store.index('folder');
            const req = idx.openCursor(IDBKeyRange.only(folderName));
            req.onsuccess = function (e) {
                const cur = e.target.result;
                if (cur) { cur.delete(); cur.continue(); }
            };
            tx.oncomplete = resolve;
            tx.onerror = function () { reject(tx.error); };
        }));
    }

    function clearDB() {
        return openDB().then(db => new Promise((resolve, reject) => {
            const tx = db.transaction(STORE, 'readwrite');
            tx.objectStore(STORE).clear();
            tx.oncomplete = resolve;
            tx.onerror = function () { reject(tx.error); };
        }));
    }

    /* ---------- intercepta a importacao de pastas ---------- */
    const originalLoad = window.loadUserFiles;
    window.loadUserFiles = function (files) {
        const copy = Array.prototype.slice.call(files || []);
        originalLoad.apply(this, arguments);
        if (!copy.length || !idbOk) return;
        saveTracks(copy)
            .then(() => toast('&#10003; ' + copy.length + ' música(s) salvas na biblioteca do player'))
            .catch(err => {
                idbOk = false;
                console.warn('[AS SOUND] Falha ao salvar biblioteca:', err);
                toast('Não foi possível salvar a biblioteca neste modo.<br>Abra o player por um servidor/atalho PWA (http ou https).', 5000);
            });
    };

    /* ---------- intercepta a exclusao de pasta ---------- */
    const originalDelete = window.executeDeleteFolder;
    window.executeDeleteFolder = function (folderName) {
        originalDelete.apply(this, arguments);
        if (!idbOk) return;
        deleteFolderFromDB(folderName).catch(err => console.warn('[AS SOUND] Falha ao remover pasta salva:', err));
    };

    /* ---------- restauracao ao abrir ---------- */
    function restore() {
        return readAll().then(rows => {
            if (!rows.length) return;
            rows.sort((a, b) => (a.savedAt - b.savedAt) || (a.order - b.order) || a.name.localeCompare(b.name));
            let count = 0;
            rows.forEach(r => {
                if (!r.blob) return;
                let url;
                try { url = URL.createObjectURL(r.blob); } catch (e) { return; }
                if (!folders[r.folder]) folders[r.folder] = [];
                folders[r.folder].push({ name: r.name, url: url });
                count++;
            });
            if (!count) return;
            renderFolders();
            if (currentFolder) renderFiles(currentFolder);
            toast('Biblioteca restaurada: ' + Object.keys(folders).length +
                  ' pasta(s), ' + count + ' música(s)');
        }).catch(err => {
            idbOk = false;
            console.warn('[AS SOUND] Biblioteca salva indisponivel:', err);
        });
    }

    /* ---------- utilitario opcional (console) ---------- */
    window.asLimparBibliotecaSalva = function () {
        return clearDB().then(() => {
            Object.keys(folders).forEach(f => { delete folders[f]; });
            currentFolder = null;
            renderFolders();
            document.getElementById('file-list-container').innerHTML = '';
            toast('Biblioteca salva apagada.');
        });
    };

    function start() {
        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist().catch(() => {});
        }
        setTimeout(restore, 300);
    }

    if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', start);
    } else {
        start();
    }
})();
</script>
